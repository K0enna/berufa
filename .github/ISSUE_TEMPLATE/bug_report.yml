name: Bug report
description: Report a reproducible defect using synthetic data only.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include a real resume, contact details, compensation, recruiter messages,
        application data, credentials, raw prompts, provider payloads, exports, or databases.
        Use a fictional minimal reproduction. Report vulnerabilities through SECURITY.md.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Describe what happened without private data or secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior or invariant
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include the smallest fictional input, commands, and sanitized output.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Highest risk surface
      options:
        - Private data or credentials
        - Document/parser safety
        - Evidence or external-action authority
        - Workspace or storage isolation
        - Provider or model boundary
        - Release or supply chain
        - Local correctness only
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used only fictional/synthetic data and included no credential or private career content.
          required: true

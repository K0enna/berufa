name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing vX.Y.Z tag to verify and attest
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Validate the requested tag run context
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The tag must match vX.Y.Z exactly." >&2
            exit 1
          fi
          if [[ "$WORKFLOW_REF" != "refs/tags/${REQUESTED_TAG}" ]]; then
            echo "The workflow itself must run at the requested tag." >&2
            exit 1
          fi

      - name: Check out the dispatched tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate the exact tag and public package version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse --verify "refs/tags/${REQUESTED_TAG}^{commit}")"
          head_commit="$(git rev-parse --verify "HEAD^{commit}")"
          if [[ "$tag_commit" != "$head_commit" || "$tag_commit" != "$WORKFLOW_SHA" ]]; then
            echo "The requested tag, workflow SHA, and checked-out HEAD must match." >&2
            exit 1
          fi
          project_version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [[ "$REQUESTED_TAG" != "v${project_version}" ]]; then
            echo "The tag does not match the public pyproject version." >&2
            exit 1
          fi

      - name: Install the pinned audit tool and public package
        run: python -m pip install --disable-pip-version-check ".[audit]" "pip-audit==2.10.1"

      - name: Generate the external CycloneDX 1.4 SBOM
        run: |
          mkdir -p .release-input
          python - <<'PY'
          import tomllib
          from pathlib import Path
          from packaging.requirements import Requirement

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          requirements = []
          for declared in project["dependencies"]:
              requirement = Requirement(declared)
              requirement.marker = None
              requirements.append(str(requirement))
          Path(".release-input/runtime-requirements.txt").write_text(
              "\n".join(requirements) + "\n", encoding="utf-8"
          )
          PY
          python -m pip_audit --progress-spinner off --format cyclonedx-json \
            --output .release-input/generated-sbom.json -r .release-input/runtime-requirements.txt

      - name: Build and verify the exact SBOM-bearing bundle
        run: |
          python -m tools.release_artifacts dist --sbom .release-input/generated-sbom.json
          python -m tools.release_artifacts dist --verify-only
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("dist")
          manifest = json.loads((root / "RELEASE-MANIFEST.json").read_text(encoding="utf-8"))
          assert len(manifest["artifacts"]) == 3
          assert any(item["kind"] == "sbom" for item in manifest["artifacts"])
          checksums = (root / "SHA256SUMS").read_text(encoding="ascii").splitlines()
          assert {line.split("  ", 1)[1] for line in checksums} == {
              item["filename"] for item in manifest["artifacts"]
          }
          for line in checksums:
              digest, filename = line.split("  ", 1)
              assert hashlib.sha256((root / filename).read_bytes()).hexdigest() == digest
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SBOM.cdx.json
            dist/RELEASE-MANIFEST.json
            dist/SHA256SUMS

      - name: Attest the wheel and sdist with the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/SBOM.cdx.json

      - name: Upload the release-candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rolevane-release-candidate
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SBOM.cdx.json
            dist/RELEASE-MANIFEST.json
            dist/SHA256SUMS
          if-no-files-found: error

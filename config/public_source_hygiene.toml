  '(?s)\A(?!(?:Copyright 2026 D[a]vid S[t]erz)\s*\Z)(?i:.*D[a]vid\s+S[t]erz)',
  '(?i)Head\s+of\s+Customer\s+Excellence',
  '(?i)Koenna(?:)Openclaw',
  '(?i)theirstack(?:)-paid-2026',
  '(?i)\b(?:Team(?:)Viewer|Iva(?:)nti|Dyna(?:)trace|Hornet(?:)security|Paess(?:)ler|Rapid(?:)7|Lean(?:)IX)\b',
]

version = 1

deny_prefixes = [
  "applications/",
  "archive/",
  "context/",
  "data/runtime/",
  "data/snapshots/",
  "docs/redesign/",
  "pipeline/",
  "private/",
  "source-documents/",
  "tmp/",
  "tools/cv/",
]

deny_paths = [
  "AGENTS.md",
  "config/api_usage_limits.local.yml",
  "config/scoring.yml",
  "config/sources.local.yml",
  "config/target_market.yml",
  "docs/operations/90_DAY_CAMPAIGN.md",
